name: Generate Git Koi

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: soaebhasan12
          body: asagi # Options: white, black, asagi, tea, gold, platinum
          output-dir: koi
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Koi
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add koi/koi.gif
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update git koi"
          git push
